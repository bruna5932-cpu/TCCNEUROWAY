# 1. Desbloqueia o arquivo temporariamente
Set-ItemProperty -Path .\android\gradle\wrapper\gradle-wrapper.properties -Name IsReadOnly -Value $false

# 2. Grava a versão 8.13 que o erro exigiu, apontando para o servidor oficial
@'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip
'@ | Out-File -FilePath .\android\gradle\wrapper\gradle-wrapper.properties -Encoding ascii -Force

# 3. Bloqueia o arquivo novamente contra o OneDrive
Set-ItemProperty -Path .\android\gradle\wrapper\gradle-wrapper.properties -Name IsReadOnly -Value $true